# Waylo: servidor predeterminado del puerto 80 (se carga PRIMERO por el 00).
#
# Apache de esta VM no tenia ningun VirtualHost: sin esto, el primero que se agrega
# (el de Waylo) pasaria a responder cualquier visita por IP o por otro nombre.
# Este bloque conserva el comportamiento anterior (la pagina del sitio principal).
# Se instala como /etc/httpd/conf.d/00-default.conf
<VirtualHost *:80>
    DocumentRoot "/var/www/html"
</VirtualHost>
