# Waylo, paso previo al certificado: solo el puerto 80.
# Sirve el desafio HTTP-01 de Let's Encrypt (webroot) y redirige lo demas a HTTPS.
# Se instala como /etc/httpd/conf.d/waylo.conf; despues se reemplaza por waylo.conf.
<VirtualHost *:80>
    ServerName 34-51-108-167.sslip.io
    ErrorLog  logs/waylo_error.log
    CustomLog logs/waylo_access.log combined

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://34-51-108-167.sslip.io%{REQUEST_URI} [R=301,L]
</VirtualHost>
