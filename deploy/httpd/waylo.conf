# Waylo: configuracion final de Apache (httpd) como proxy inverso. Se instala como /etc/httpd/conf.d/waylo.conf.
# Requiere: mod_ssl instalado, el certificado emitido (docs/vm-setup.md, paso 4) y 00-default.conf cargado.
# No modifica nada del otro proyecto: es un VirtualHost con nombre propio.

<VirtualHost *:80>
    ServerName 34-51-108-167.sslip.io
    ErrorLog  logs/waylo_error.log
    CustomLog logs/waylo_access.log combined

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://34-51-108-167.sslip.io%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName 34-51-108-167.sslip.io
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/34-51-108-167.sslip.io/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/34-51-108-167.sslip.io/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3

    ErrorLog logs/waylo_error.log
    # El token JWT del WebSocket viaja en la URL: esa ruta no se registra en el log de accesos.
    SetEnvIf Request_URI "^/ws" waylo_nolog
    CustomLog logs/waylo_access.log combined env=!waylo_nolog

    # HSTS corto mientras el nombre sea provisional (sslip.io). Subirlo con un dominio definitivo.
    Header always set Strict-Transport-Security "max-age=604800"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(self), camera=(), microphone=()"

    # Fotos de reportes: 5 MB de imagen más el formulario (la app valida los 5 MB).
    LimitRequestBody 8388608

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Tiempo real (Flask + Flask-Sock). Lo especifico va primero.
    ProxyPass        "/ws"            "ws://127.0.0.1:5950/ws" timeout=3600
    ProxyPassReverse "/ws"            "ws://127.0.0.1:5950/ws"
    ProxyPass        "/health/waylo"  "http://127.0.0.1:5950/health"

    # Web y API (Next.js)
    ProxyPass        "/" "http://127.0.0.1:3100/"
    ProxyPassReverse "/" "http://127.0.0.1:3100/"
</VirtualHost>
