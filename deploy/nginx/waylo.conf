# Waylo: archivo para /etc/nginx/conf.d/waylo.conf
# Tiene su propio server_name; no modifica los bloques del otro proyecto de la VM.
# Requiere que el certificado ya exista (ver docs/vm-setup.md, paso 4).

# Upgrade de WebSocket solo cuando el cliente lo pide.
map $http_upgrade $waylo_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 34-51-108-167.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 34-51-108-167.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/34-51-108-167.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34-51-108-167.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:waylo_ssl:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # El GPS exige ubicacion permitida solo para este origen.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    client_max_body_size 5m;

    # Tiempo real (Flask + Flask-Sock)
    location /ws {
        proxy_pass http://127.0.0.1:5950;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $waylo_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /health/waylo {
        proxy_pass http://127.0.0.1:5950/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Web y API (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
