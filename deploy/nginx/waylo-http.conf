# Waylo, paso previo al certificado: solo el puerto 80.
# Sirve el desafio HTTP-01 de Let's Encrypt (webroot) y nada mas.
# Se instala como /etc/nginx/conf.d/waylo.conf; despues se reemplaza por waylo.conf.
server {
    listen 80;
    listen [::]:80;
    server_name 34-51-108-167.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
